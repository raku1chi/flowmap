<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Inventory Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="demo-external" content="__EXTERNAL_URL__" />
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header class="top">
  <a href="/" class="brand" data-link>在庫管理デモ</a>
  <nav>
    <a href="/items" data-link>商品一覧</a>
    <a href="/contact" data-link>お問い合わせ</a>
    <a href="/settings" data-link>設定</a>
    <a href="/report" data-link>レポート</a>
    <a href="/about" data-link>このアプリについて</a>
  </nav>
  <form class="search" role="search" id="search-form">
    <input type="search" name="q" placeholder="商品名で検索" autocomplete="off" aria-label="商品名で検索" />
    <button type="submit">検索</button>
    <div class="suggest" id="suggest" hidden></div>
  </form>
  <button id="logout" class="ghost">ログアウト</button>
</header>
<div class="prefbar">
  <!-- 表示順はこの端末の localStorage に保存され、開き直しても残る。summary には今の値が出る -->
  <details id="pref"><summary>表示順: <b id="pref-label">標準</b></summary>
    <div class="row" id="pref-options"></div>
  </details>
</div>
<main id="app"></main>
<!-- 比較トレイ。sessionStorage に残り、どの画面にも出る（中身があるときだけ） -->
<aside id="tray" class="tray" aria-label="比較トレイ" hidden></aside>
<footer class="foot">在庫管理デモ · <span data-flowmap-volatile>サーバー時刻 <span id="clock">--:--:--</span></span></footer>
<div id="modal-root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
